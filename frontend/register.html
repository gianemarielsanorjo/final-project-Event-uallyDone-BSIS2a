
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT-UALLY DONE | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
        }

        .brand {
            color: #294c75;
            font-weight: bold;
        }

        .register-container {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 15px;
            padding: 35px;
        }

        .register-title {
            color: #294c75;
            font-weight: bold;
        }

        .btn-register {
            background-color: #294c75;
            color: white;
            padding: 12px;
        }

        .btn-register:hover {
            background-color: #1e3858;
            color: white;
        }

        .form-control, .form-select {
            padding: 11px;
        }
    </style>
</head>

<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="index.html">
                EVENT-UALLY DONE
            </a>

            <a href="index.html" class="btn btn-outline-primary btn-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <section class="register-container">

        <div class="card register-card shadow">

            <div class="text-center mb-4">
                <h2 class="register-title">Create an Account</h2>

                <p class="text-muted">
                    Join EVENT-UALLY DONE today!
                </p>
            </div>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="full_name" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">
                        Select User Role
                    </label>

                    <select
                        class="form-select"
                        id="role"
                        name="role"
                        required
                    >
                        <option value="" selected disabled>
                            Choose your role
                        </option>

                        <option value="Student">Student</option>
                        <option value="Event Organizer">Event Organizer</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label class="form-check-label" for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit" class="btn btn-register w-100" id="registerButton">
                    Create Account
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="mb-0">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none">
                        Login here
                    </a>
                </p>
            </div>

        </div>

    </section>

    <footer class="text-center py-3 text-muted">
        <small>
            &copy; 2026 EVENT-UALLY DONE | Event Handlers
        </small>
    </footer>

    <script>
        const API_URL = `${window.location.origin}/api/auth`;

        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const registerButton = document.getElementById("registerButton");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const full_name = document.getElementById("full_name").value.trim();
            const email = document.getElementById("email").value.trim();
            const role = document.getElementById("role").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            message.classList.add("d-none");

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                message.className = "alert alert-danger";
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Creating account...";

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        full_name,
                        email,
                        password,
                        confirmPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed.");
                }

                message.textContent = "Registration successful! Redirecting to login...";
                message.className = "alert alert-success";

                registerForm.reset();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                message.textContent = error.message;
                message.className = "alert alert-danger";

            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Create Account";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
