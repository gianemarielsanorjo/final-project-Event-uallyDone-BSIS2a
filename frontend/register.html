
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT-UALLY DONE | Register</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
        }

        .brand {
            color: #294c75;
            font-weight: bold;
        }

        .register-container {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 15px;
            padding: 35px;
        }

        .register-title {
            color: #294c75;
            font-weight: bold;
        }

        .btn-register {
            background-color: #294c75;
            color: white;
            padding: 12px;
        }

        .btn-register:hover {
            background-color: #1e3858;
            color: white;
        }

        .form-control, .form-select {
            padding: 11px;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="index.html">
                EVENT-UALLY DONE
            </a>

            <a href="index.html" class="btn btn-outline-primary btn-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <!-- REGISTRATION FORM -->
    <section class="register-container">

        <div class="card register-card shadow">

            <div class="text-center mb-4">
                <h2 class="register-title">Create an Account</h2>

                <p class="text-muted">
                    Join EVENT-UALLY DONE today!
                </p>
            </div>

            <form action="#" method="POST">

                <!-- FULL NAME -->
                <div class="mb-3">
                    <label for="full_name" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- ROLE -->
                <div class="mb-3">
                    <label for="role" class="form-label">
                        Select User Role
                    </label>

                    <select
                        class="form-select"
                        id="role"
                        name="role"
                        required
                    >
                        <option value="" selected disabled>
                            Choose your role
                        </option>

                        <option value="Student">Student</option>
                        <option value="Event Organizer">Event Organizer</option>
                    </select>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <!-- TERMS AND CONDITIONS -->
                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label class="form-check-label" for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <!-- REGISTER BUTTON -->
                <button type="submit" class="btn btn-register w-100">
                    Create Account
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="mb-0">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none">
                        Login here
                    </a>
                </p>
            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="text-center py-3 text-muted">
        <small>
            &copy; 2026 EVENT-UALLY DONE | Event Handlers
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
