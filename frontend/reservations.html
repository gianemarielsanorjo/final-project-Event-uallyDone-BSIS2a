
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | EVENT-UALLY DONE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 40px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .table th {
            background-color: #e9eef5;
            white-space: nowrap;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background-color: #fff3cd;
            color: #856404;
        }

        .status.Approved {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .status.Rejected {
            background-color: #f8d7da;
            color: #842029;
        }

        #stockInfo {
            font-size: 13px;
            color: #198754;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container pb-5">

    <div class="page-header">
        <div>
            <h2 class="fw-bold">Reservations</h2>
            <p class="text-muted mb-0">
                Manage your event equipment reservations.
            </p>
        </div>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addReservationModal">
            + New Reservation
        </button>
    </div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Event Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="reservationTable">
                    <tr>
                        <td colspan="6" class="text-center">
                            Loading reservations...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- ADD RESERVATION MODAL -->
<div class="modal fade" id="addReservationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title fw-bold">New Reservation</h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <form id="reservationForm">

                    <div class="mb-3">
                        <label class="form-label">Event Name</label>
                        <input type="text"
                               class="form-control"
                               name="event_name"
                               placeholder="Enter event name"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Inventory Item</label>

                        <select class="form-select"
                                name="item"
                                id="itemSelect"
                                required>
                            <option value="">Loading inventory...</option>
                        </select>

                        <div id="stockInfo"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>

                        <input type="number"
                               class="form-control"
                               name="quantity"
                               id="quantityInput"
                               min="1"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Date</label>

                        <input type="date"
                               class="form-control"
                               name="event_date"
                               id="eventDate"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>

                        <textarea class="form-control"
                                  name="description"
                                  rows="3"
                                  placeholder="Optional description"></textarea>
                    </div>

                    <div id="formMessage"></div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit"
                                class="btn btn-primary"
                                id="submitButton">
                            Submit Reservation
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<!-- EDIT RESERVATION MODAL -->
<div class="modal fade" id="editReservationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title fw-bold">Edit Reservation</h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <form id="editReservationForm">

                    <input type="hidden" id="editReservationId">

                    <div class="mb-3">
                        <label class="form-label">Event Name</label>
                        <input type="text"
                               class="form-control"
                               id="editEventName"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Inventory Item</label>
                        <select class="form-select"
                                id="editItemSelect"
                                required>
                            <option value="">Select an item</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number"
                               class="form-control"
                               id="editQuantity"
                               min="1"
                               required>
                        <div id="editStockInfo" class="text-success small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Date</label>
                        <input type="date"
                               class="form-control"
                               id="editEventDate"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control"
                                  id="editDescription"
                                  rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="editStatus" required>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>

                    <div id="editFormMessage"></div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit"
                                class="btn btn-primary"
                                id="updateReservationButton">
                            Save Changes
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<!-- EXTERNAL JAVASCRIPT FILES -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="/js/reservations.js" defer></script>

</body>
</html>
