
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT-UALLY DONE | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
        }

        .brand {
            color: #294c75;
            font-weight: bold;
        }

        .login-container {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
            padding: 35px;
        }

        .login-title {
            color: #294c75;
            font-weight: bold;
        }

        .btn-login {
            background-color: #294c75;
            color: white;
            padding: 12px;
        }

        .btn-login:hover {
            background-color: #1e3858;
            color: white;
        }

        .form-control {
            padding: 11px;
        }
    </style>
</head>

<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="index.html">
                EVENT-UALLY DONE
            </a>

            <a href="index.html" class="btn btn-outline-primary btn-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <section class="login-container">
        <div class="card login-card shadow">

            <div class="text-center mb-4">
                <h2 class="login-title">Welcome Back!</h2>
                <p class="text-muted">
                    Login to your EVENT-UALLY DONE account.
                </p>
            </div>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="remember"
                        name="remember"
                    >

                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-login w-100" id="loginButton">
                    Login
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="mb-0">
                    Don't have an account?
                    <a href="register.html" class="text-decoration-none">
                        Register here
                    </a>
                </p>
            </div>

        </div>
    </section>

    <footer class="text-center py-3 text-muted">
        <small>
            &copy; 2026 EVENT-UALLY DONE | Event Handlers
        </small>
    </footer>

    <script>
        const API_URL = "http://localhost:3000/api/auth";

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.classList.add("d-none");
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                if (!data.token) {
                    throw new Error("Login succeeded but no authentication token was received.");
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify(data.user));

                message.textContent = "Login successful! Redirecting...";
                message.className = "alert alert-success";

                // REDIRECT TO THE CORRECT FRONTEND DASHBOARD
                window.location.href = "/dashboard";

            } catch (error) {
                message.textContent = error.message;
                message.className = "alert alert-danger";

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
