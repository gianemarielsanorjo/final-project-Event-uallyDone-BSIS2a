
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT-UALLY DONE | Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
        }

        .brand, h2 {
            color: #294c75;
            font-weight: bold;
        }

        .form-container {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .form-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 15px;
            padding: 35px;
        }

        .btn-submit {
            background-color: #294c75;
            color: white;
            padding: 12px;
        }

        .btn-submit:hover {
            background-color: #1e3858;
            color: white;
        }

        .form-control {
            padding: 11px;
        }
    </style>
</head>

<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="index.html">
                EVENT-UALLY DONE
            </a>

            <a href="index.html" class="btn btn-outline-primary btn-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <section class="form-container">
        <div class="card form-card shadow">

            <div class="text-center mb-4">
                <h2>Add New Product</h2>
                <p class="text-muted">
                    Enter the product details below.
                </p>
            </div>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="productForm">

                <div class="mb-3">
                    <label for="name" class="form-label">Product Name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Price</label>
                    <input
                        type="number"
                        class="form-control"
                        id="price"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea
                        class="form-control"
                        id="description"
                        rows="3"
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-submit w-100" id="submitButton">
                    Add Product
                </button>

            </form>
        </div>
    </section>

    <footer class="text-center py-3 text-muted">
        <small>
            &copy; 2026 EVENT-UALLY DONE | Event Handlers
        </small>
    </footer>

    <script>
        const API_URL = "http://localhost:3000/api/products";

        const productForm = document.getElementById("productForm");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        productForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const price = Number(document.getElementById("price").value);
            const description = document.getElementById("description").value.trim();

            message.className = "alert d-none";

            if (!name || !Number.isFinite(price) || price <= 0) {
                message.textContent = "Please enter a valid product name and price.";
                message.className = "alert alert-danger";
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Saving product...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        price,
                        description
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Failed to add product.");
                }

                message.textContent = "Product added successfully!";
                message.className = "alert alert-success";

                productForm.reset();

            } catch (error) {
                message.textContent = error.message;
                message.className = "alert alert-danger";

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Add Product";
            }
        });
    </script>

</body>
</html>
